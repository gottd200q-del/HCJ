<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to GIF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#151a23;
    --ink-soft:#5b6472;
    --line:#e4e7ec;
    --surface:#ffffff;
    --canvas:#f6f7f9;
    --accent:#7c5cff;
    --accent-dark:#5f3fe0;
    --accent-soft:#efeaff;
    --warn:#e2574c;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter', sans-serif;
    background:var(--canvas);
    color:var(--ink);
    min-height:100vh;
  }

  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:13px;
    color: var(--accent-dark);
    letter-spacing:0.3px;
  }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .app-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:17px; color:var(--ink);
  }

  .hero{
    text-align:center;
    padding:52px 24px 20px;
  }
  .hero h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:800;
    font-size:clamp(36px, 7vw, 58px);
    margin:0 0 10px;
    letter-spacing:-0.5px;
  }
  .hero h1 .arrow{ color:var(--accent); }
  .hero .tagline{
    font-size:16px;
    color:var(--ink-soft);
    margin:0;
  }

  .container{
    max-width:720px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  .panel{
    background:var(--surface);
    border-radius:18px;
    border:1px solid var(--line);
    padding:26px;
    box-shadow:0 14px 34px rgba(16,22,35,0.06);
  }
  .panel + .panel{ margin-top:20px; }

  .dropzone{
    border:1.5px dashed #c9c2f0;
    border-radius:14px;
    padding:44px 20px;
    text-align:center;
    background:#fbfaff;
    transition: border-color 0.2s ease, background 0.2s ease;
    cursor:pointer;
  }
  .dropzone.drag{
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone svg{ width:40px; height:40px; margin-bottom:14px; }
  .dz-title{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600; margin-bottom:5px; }
  .dz-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; }

  .select-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink); color:#fff; border:none;
    padding:11px 22px; border-radius:999px;
    font-size:13.5px; font-weight:600; font-family:'Inter', sans-serif;
    cursor:pointer; transition: transform 0.15s ease, background 0.15s ease;
  }
  .select-btn:hover{ background:#000; transform:translateY(-1px); }
  input[type=file]{ display:none; }

  .settings-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .settings-row label{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .fps-select{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
    font-size:12.5px;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:#fff;
  }

  .queue-section{ display:none; margin-top:20px; }
  .queue-section.show{ display:block; }

  .queue-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px;
  }
  .queue-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; font-weight:600; margin:0;
  }
  .queue-summary{ font-size:12px; color:var(--ink-soft); }

  .file-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .file-row:last-child{ border-bottom:none; }

  .thumb-wrap{
    width:64px; height:48px;
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
    background:#0f1117;
    border:1px solid var(--line);
    position:relative;
  }
  .thumb-wrap canvas, .thumb-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .thumb-wrap .play-badge{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px;
    background:rgba(0,0,0,0.15);
    pointer-events:none;
  }

  .file-body{ flex:1; min-width:0; }
  .file-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .file-name{
    font-size:13px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .file-meta{ font-size:11px; color:var(--ink-soft); flex-shrink:0; white-space:nowrap; }

  .progress-track{
    margin-top:8px; height:6px; border-radius:999px;
    background:#eef0f3; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    border-radius:999px;
    transition: width 0.2s ease;
  }
  .progress-fill.failed{ background:var(--warn); }
  .file-status{ margin-top:5px; font-size:11px; color:var(--ink-soft); }
  .file-status.ok{ color:var(--accent-dark); }
  .file-status.err{ color:var(--warn); }

  .row-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .download-btn{
    background: var(--accent); color:#fff; border:none;
    padding:7px 15px; border-radius:999px;
    font-size:11.5px; font-weight:700; font-family:'Inter', sans-serif;
    cursor:pointer; opacity:0.4; pointer-events:none;
    transition: opacity 0.2s ease, transform 0.15s ease, background 0.15s ease;
    white-space:nowrap;
  }
  .download-btn.ready{ opacity:1; pointer-events:auto; }
  .download-btn.ready:hover{ background:var(--accent-dark); transform:translateY(-1px); }
  .remove-btn{
    background:none; border:none; color:#b0b7c2;
    font-size:15px; cursor:pointer; line-height:1; padding:2px;
  }
  .remove-btn:hover{ color:var(--warn); }

  .footnote{
    margin-top:16px; font-size:11.5px; color:#9aa2ae; line-height:1.6;
    text-align:center;
  }

  @media (max-width:480px){
    .panel{ padding:18px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>NANALAB</div>
    <div class="app-title">Video to GIF</div>
  </div>

  <div class="hero">
    <h1>Video <span class="arrow">→</span> GIF</h1>
    <p class="tagline">Make your own GIF Animation!</p>
  </div>

  <div class="container">
    <div class="panel">
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="6" y="12" width="28" height="24" rx="3" stroke="#5f3fe0" stroke-width="3"/>
          <path d="M34 20l8-5v18l-8-5" stroke="#151a23" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        <div class="dz-title">동영상을 끌어다 놓으세요</div>
        <div class="dz-sub">또는 버튼으로 직접 업로드하세요</div>
        <button class="select-btn" id="selectBtn" type="button">파일 업로드</button>
        <input type="file" id="fileInput" multiple accept="video/*">

        <div class="settings-row">
          <label for="fpsSelect">GIF 프레임레이트</label>
          <select class="fps-select" id="fpsSelect">
            <option value="8">8 fps</option>
            <option value="10">10 fps</option>
            <option value="15" selected>15 fps</option>
            <option value="20">20 fps</option>
            <option value="24">24 fps</option>
            <option value="29">29 fps (최대)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel queue-section" id="queueSection">
      <div class="queue-head">
        <h2>변환 목록</h2>
        <div class="queue-summary" id="queueSummary"></div>
      </div>
      <div id="fileList"></div>
      <div class="footnote">작업 속도를 위해 프레임레이트는 최대 29fps로 제한되고, 긴 영상은 앞부분 최대 20초만 변환됩니다. 파일명은 원본파일명.gif로 저장돼요.</div>
    </div>
  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const selectBtn = document.getElementById('selectBtn');
  const fpsSelect = document.getElementById('fpsSelect');
  const queueSection = document.getElementById('queueSection');
  const fileList = document.getElementById('fileList');
  const queueSummary = document.getElementById('queueSummary');

  const MAX_FPS = 29;
  const MAX_DURATION = 20;   // seconds - safety cap so conversion doesn't run too long
  const MAX_WIDTH = 480;     // downscale large videos for speed
  const MAX_FRAMES = 220;    // hard cap on total frames encoded

  let fileCounter = 0;
  let queue = [];
  let workerBlobUrlPromise = null;

  function getWorkerScriptUrl(){
    if(!workerBlobUrlPromise){
      workerBlobUrlPromise = fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
        .then(res => res.blob())
        .then(blob => URL.createObjectURL(blob));
    }
    return workerBlobUrlPromise;
  }

  // ---- upload wiring ----
  selectBtn.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('click', (e) => { if(e.target === selectBtn || e.target.closest('.settings-row')) return; fileInput.click(); });
  fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value=''; });

  ['dragenter','dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      if(evt === 'dragleave' && e.target !== dropzone) return;
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', (e) => { if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files); });

  function handleFiles(fileListArg){
    const files = Array.from(fileListArg).filter(f => f.type.startsWith('video/'));
    if(!files.length) return;
    queueSection.classList.add('show');
    files.forEach(addFileRow);
  }

  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(2) + ' MB';
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function addFileRow(file){
    const id = 'v' + (++fileCounter);
    const fps = Math.min(parseInt(fpsSelect.value, 10) || 15, MAX_FPS);

    queue.push({ id, file, done:false });
    updateSummary();

    const row = document.createElement('div');
    row.className = 'file-row';
    row.id = id;
    row.innerHTML = `
      <div class="thumb-wrap" id="${id}-thumbwrap"><div class="play-badge">🎬</div></div>
      <div class="file-body">
        <div class="file-top">
          <div class="file-name">${escapeHtml(file.name)}</div>
          <div class="file-meta">${fmtSize(file.size)} · ${fps}fps</div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="${id}-fill"></div></div>
        <div class="file-status" id="${id}-status">대기 중</div>
      </div>
      <div class="row-actions">
        <button class="download-btn" id="${id}-dl">다운로드</button>
        <button class="remove-btn" id="${id}-remove" title="목록에서 제거">✕</button>
      </div>
    `;
    fileList.appendChild(row);

    document.getElementById(`${id}-remove`).addEventListener('click', () => {
      row.remove();
      queue = queue.filter(q => q.id !== id);
      updateSummary();
    });

    convertToGif(file, id, fps);
  }

  function updateSummary(){
    const total = queue.length;
    const done = queue.filter(q => q.done).length;
    queueSummary.textContent = total ? `${done} / ${total} 완료` : '';
  }

  function setProgress(id, pct, failed){
    const el = document.getElementById(`${id}-fill`);
    if(!el) return;
    el.style.width = Math.min(100, Math.max(0, pct)) + '%';
    if(failed) el.classList.add('failed');
  }
  function setStatus(id, text, kind){
    const el = document.getElementById(`${id}-status`);
    if(!el) return;
    el.textContent = text;
    el.className = 'file-status' + (kind ? ' '+kind : '');
  }

  function waitEvent(el, evt){
    return new Promise((resolve) => {
      const handler = () => { el.removeEventListener(evt, handler); resolve(); };
      el.addEventListener(evt, handler);
    });
  }

  async function convertToGif(file, id, fps){
    setStatus(id, '영상 불러오는 중…');
    const objUrl = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.src = objUrl;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';

    try{
      await Promise.race([
        waitEvent(video, 'loadedmetadata'),
        new Promise((_, rej) => setTimeout(() => rej(new Error('metadata timeout')), 15000))
      ]);

      const rawDuration = video.duration && isFinite(video.duration) ? video.duration : 3;
      const duration = Math.min(rawDuration, MAX_DURATION);

      const scale = Math.min(1, MAX_WIDTH / video.videoWidth);
      const outW = Math.max(2, Math.round(video.videoWidth * scale));
      const outH = Math.max(2, Math.round(video.videoHeight * scale));

      let frameCount = Math.max(1, Math.floor(duration * fps));
      frameCount = Math.min(frameCount, MAX_FRAMES);
      const interval = duration / frameCount;

      const canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      const ctx = canvas.getContext('2d');

      // thumbnail from first frame
      video.currentTime = 0.01;
      await Promise.race([waitEvent(video, 'seeked'), new Promise(r => setTimeout(r, 1200))]);
      ctx.drawImage(video, 0, 0, outW, outH);
      const thumbWrap = document.getElementById(`${id}-thumbwrap`);
      thumbWrap.innerHTML = '';
      const thumbImg = document.createElement('img');
      thumbImg.src = canvas.toDataURL('image/jpeg', 0.7);
      thumbWrap.appendChild(thumbImg);

      setStatus(id, `프레임 추출 중… (0/${frameCount})`);

      const workerScript = await getWorkerScriptUrl();
      const gif = new GIF({
        workers: 2,
        quality: 10,
        workerScript,
        width: outW,
        height: outH
      });

      for(let i = 0; i < frameCount; i++){
        const t = Math.min(duration - 0.001, i * interval);
        video.currentTime = t;
        await Promise.race([waitEvent(video, 'seeked'), new Promise(r => setTimeout(r, 800))]);
        ctx.drawImage(video, 0, 0, outW, outH);
        gif.addFrame(ctx, { copy:true, delay: Math.round(interval * 1000) });

        const extractPct = ((i + 1) / frameCount) * 65;
        setProgress(id, extractPct);
        setStatus(id, `프레임 추출 중… (${i+1}/${frameCount})`);
      }

      setStatus(id, 'GIF 인코딩 중…');
      gif.on('progress', (p) => {
        setProgress(id, 65 + p * 35);
      });

      const blob = await new Promise((resolve) => {
        gif.on('finished', (b) => resolve(b));
        gif.render();
      });

      setProgress(id, 100);
      const url = URL.createObjectURL(blob);
      const baseName = file.name.replace(/\.[^.]+$/, '');
      const outName = `${baseName}.gif`;

      setStatus(id, `완료 · ${outW}×${outH} · ${fmtSize(blob.size)}`, 'ok');
      const dlBtn = document.getElementById(`${id}-dl`);
      dlBtn.classList.add('ready');
      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = outName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const entry = queue.find(q => q.id === id);
      if(entry) entry.done = true;
      updateSummary();

    } catch(err){
      setProgress(id, 100, true);
      setStatus(id, '변환 실패 · 다른 파일로 시도해 주세요', 'err');
      const entry = queue.find(q => q.id === id);
      if(entry) entry.done = true;
      updateSummary();
    } finally {
      URL.revokeObjectURL(objUrl);
    }
  }
</script>
</body>
</html>
