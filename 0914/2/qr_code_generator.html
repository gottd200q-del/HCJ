  .bg-veil{
    position:absolute;
    inset:0;
    background:
      radial-gradient(60% 50% at 50% 40%, rgba(59,31,92,0) 0%, rgba(42,21,70,0.55) 70%, rgba(26,13,45,0.85) 100%);
    pointer-events:none;
  }

  .sparkle{
    position:absolute;
    border-radius:50%;
    background: var(--gold);
    opacity:0.55;
    box-shadow: 0 0 6px 1px rgba(240,199,94,0.6);
    animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.7); }
    50%{ opacity:0.8; transform:scale(1.15); }
  }

  .stage{
    position:relative;
    z-index:2;
    width:min(92vw, 420px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(22px, 5vw, 28px);
    color:var(--paper);
    text-align:center;
    letter-spacing:0.3px;
    text-shadow: 0 2px 14px rgba(59,31,92,0.6);
    transition: transform 0.6s cubic-bezier(.4,0,.2,1), margin 0.6s cubic-bezier(.4,0,.2,1), opacity 0.5s ease;
  }

  .subtitle{
    font-size:14px;
    color: var(--candy-pink);
    text-align:center;
    margin-top:-14px;
    opacity:0.9;
    transition: opacity 0.4s ease, height 0.4s ease, margin 0.4s ease;
  }

  .input-row{
    width:100%;
    display:flex;
    gap:10px;
    transition: transform 0.6s cubic-bezier(.4,0,.2,1);
  }

  .url-input{
    flex:1;
    padding:14px 18px;
    border-radius:999px;
    border:2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: var(--paper);
    font-family:'Nunito', sans-serif;
    font-size:15px;
    outline:none;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .url-input::placeholder{ color: rgba(255,255,255,0.65); }
  .url-input:focus{
    border-color: var(--gold);
    background: rgba(255,255,255,0.2);
  }

  .go-btn{
    width:52px; height:52px;
    border-radius:50%;
    border:none;
    background: linear-gradient(145deg, var(--gold), #e0a83c);
    color: var(--deep-violet);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(240,199,94,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    flex-shrink:0;
  }
  .go-btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 18px rgba(240,199,94,0.55); }
  .go-btn:active{ transform: translateY(0px) scale(0.96); }

  .error-msg{
    font-size:13px;
    color:#ffd9e6;
    height:16px;
    text-align:center;
    opacity:0;
    transition: opacity 0.25s ease;
  }
  .error-msg.show{ opacity:1; }

  .qr-wrap{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .qr-card{
    background: var(--paper);
    padding:20px;
    border-radius:22px;
    box-shadow: 0 18px 50px rgba(20,8,40,0.55), 0 0 0 6px rgba(255,255,255,0.06);
    transform: scale(0.85);
    opacity:0;
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1), opacity 0.45s ease;
  }
  .qr-card.reveal{
    transform: scale(1);
    opacity:1;
  }

  #qrcode img, #qrcode canvas{
    display:block;
    border-radius:8px;
  }

  .qr-url{
    max-width:280px;
    font-size:12.5px;
    color: var(--candy-pink);
    text-align:center;
    word-break:break-all;
    opacity:0.85;
  }

  .reset-btn{
    margin-top:2px;
    background:none;
    border:1.5px solid rgba(255,255,255,0.35);
    color: var(--paper);
    font-family:'Nunito', sans-serif;
    font-size:13px;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .reset-btn:hover{
    background: rgba(255,255,255,0.12);
    border-color: var(--gold);
  }

  /* --- state: submitted --- */
  .stage.submitted .title{
    transform: translateY(0);
    font-size:16px;
    opacity:0.85;
  }
  .stage.submitted .subtitle{
    opacity:0;
    height:0;
    margin:0;
    overflow:hidden;
  }
  .stage.submitted .input-form{
    order:3;
    transform: translateY(6px);
  }
  .stage.submitted .input-row{
    transform: scale(0.92);
  }
  .stage.submitted .url-input{
    padding:10px 16px;
    font-size:13px;
  }
  .stage.submitted .go-btn{
    width:42px; height:42px;
    font-size:16px;
  }
  .stage.submitted .qr-wrap{
    order:2;
    display:flex;
  }

  .input-form{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transition: order 0s, transform 0.5s ease;
  }
</style>
</head>
<body>

  <div class="bg-art"></div>
  <div class="bg-veil"></div>

  <div class="stage" id="stage">
    <div class="title" id="title">URL을 QR 코드로 만들어요</div>
    <div class="subtitle" id="subtitle">주소를 입력하고 요정에게 부탁해보세요</div>

    <div class="input-form" id="inputForm">
      <div class="input-row">
        <input type="text" class="url-input" id="urlInput" placeholder="https://example.com" autocomplete="off">
        <button class="go-btn" id="goBtn" aria-label="QR 코드 생성" title="QR 코드 생성">✓</button>
      </div>
      <div class="error-msg" id="errorMsg">올바른 URL을 입력해 주세요</div>
    </div>

    <div class="qr-wrap" id="qrWrap">
      <div class="qr-card" id="qrCard">
        <div id="qrcode"></div>
      </div>
      <div class="qr-url" id="qrUrlText"></div>
      <button class="reset-btn" id="resetBtn">다른 URL 입력하기</button>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const urlInput = document.getElementById('urlInput');
  const goBtn = document.getElementById('goBtn');
  const errorMsg = document.getElementById('errorMsg');
  const qrWrap = document.getElementById('qrWrap');
  const qrCard = document.getElementById('qrCard');
  const qrUrlText = document.getElementById('qrUrlText');
  const resetBtn = document.getElementById('resetBtn');
  const qrcodeDiv = document.getElementById('qrcode');

  function normalizeUrl(raw){
    let v = raw.trim();
    if(!v) return null;
    if(!/^https?:\/\//i.test(v)){
      v = 'https://' + v;
    }
    try{
      const u = new URL(v);
      if(!u.hostname || !u.hostname.includes('.')) return null;
      return u.href;
    }catch(e){
      return null;
    }
  }

  function generate(){
    const normalized = normalizeUrl(urlInput.value);
    if(!normalized){
      errorMsg.classList.add('show');
      urlInput.focus();
      return;
    }
    errorMsg.classList.remove('show');

    qrcodeDiv.innerHTML = '';
    new QRCode(qrcodeDiv, {
      text: normalized,
      width: 200,
      height: 200,
      colorDark: '#3b1f5c',
      colorLight: '#fff9fc',
      correctLevel: QRCode.CorrectLevel.M
    });

    qrUrlText.textContent = normalized;
    stage.classList.add('submitted');
    qrCard.classList.remove('reveal');
    requestAnimationFrame(() => {
      setTimeout(() => qrCard.classList.add('reveal'), 260);
    });
  }

  function reset(){
    stage.classList.remove('submitted');
    qrCard.classList.remove('reveal');
    errorMsg.classList.remove('show');
    urlInput.value = '';
    setTimeout(() => urlInput.focus(), 350);
  }

  goBtn.addEventListener('click', generate);
  urlInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') generate();
  });
  resetBtn.addEventListener('click', reset);

  // gentle sparkles
  const stageEl = document.body;
  for(let i=0;i<14;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = 2 + Math.random()*3;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2.6+Math.random()*2.4)+'s';
    stageEl.appendChild(s);
  }
</script>
</body>
</html>
